name: Windows

on:
  push:
    paths: ["windows/**", "protocol/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "protocol/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  host:
    name: Host, core and tests (x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S windows -B windows/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build windows/build
      - name: Unit tests
        run: ctest --test-dir windows/build --output-on-failure
      - name: Protocol vectors are reproducible
        shell: bash
        run: |
          pip install cryptography==46.0.*
          python -I protocol/tools/gen_vectors.py
          git diff --exit-code protocol/test-vectors
      - uses: actions/upload-artifact@v4
        with:
          name: mediaduet-host-x64
          path: |
            windows/build/MediaDuet.exe
            windows/build/MediaDuetProbe.exe

  ui:
    name: WinUI 3 UI (x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build MediaDuetUI
        run: msbuild windows/ui/MediaDuetUI.vcxproj -restore -m -p:Configuration=Release -p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: mediaduet-ui-x64
          path: windows/ui/bin/x64/Release/**
