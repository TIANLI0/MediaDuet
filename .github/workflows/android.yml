name: Android

on:
  push:
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :testplayer:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mediaduet-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/reports/tests/**
            android/app/build/reports/lint-results-debug.html
